spring.boot.admin.contextPath=/admin

spring.boot.admin.monitor.status-change-detection-strategy=status_only

spring.boot.admin.instance-auth.default-user-name=admin
spring.boot.admin.instance-auth.default-password=topsecret

spring.boot.admin.instance-auth.service-map.my-service.userName=me
spring.boot.admin.instance-auth.service-map.my-service.userPassword=secret
spring.boot.admin.instance-auth.service-map.my-service.allowed-hosts=my-service.example.com,*.my-service.svc.cluster.local
spring.boot.admin.instance-auth.default-allowed-hosts=*.svc.cluster.local
spring.boot.admin.ssrf-protection.allowed-hosts=*.example.com
